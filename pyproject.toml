[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "alibaba-scraper"
version = "0.1.0"
description = "Async-first Alibaba public product data collection toolkit"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "hasnocool" }]
dependencies = [
  "httpx[http2]>=0.28.1",
  "pydantic>=2.11",
  "pydantic-settings>=2.10",
  "selectolax>=0.3.30",
  "typer>=0.16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
]
browser = [
  "playwright>=1.54",
]

[project.scripts]
alibaba-scraper = "alibaba_scraper.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/alibaba_scraper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
